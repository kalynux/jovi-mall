<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login & Connect Google Calendar</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        max-width: 500px;
        margin: auto;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 16px;
      }
      button {
        cursor: pointer;
      }
      #connect {
        display: none;
        margin-top: 30px;
      }
      .error {
        color: red;
        margin-top: 10px;
      }
      .success {
        color: green;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>User Login (Session Cookie)</h2>

    <input
      id="identifier"
      type="text"
      placeholder="Email or Phone"
      value="vendor@example.com"
    />
    <input
      id="password"
      type="password"
      placeholder="Password"
      value="password123"
    />

    <select id="role">
      <option value="vendor">Vendor</option>
      <option value="customer">Customer</option>
      <option value="agency">Agency</option>
      <option value="agent">Agent</option>
      <option value="admin">Admin</option>
    </select>

    <button onclick="login()">Login with Session Cookie</button>

    <div id="message"></div>

    <div id="connect">
      <h2>Google Calendar</h2>
      <button onclick="connectGoogle()">Connect Google Calendar</button>
    </div>

    <script>
      async function login() {
        const identifier = document.getElementById("identifier").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        console.log({ identifier, password, role });

        try {
          // Use browser session endpoint (NOT /api/auth/login)
          const res = await fetch(
            "http://localhost:3000/api/auth/browser/login",
            {
              method: "POST",
              credentials: "include", // 🔑 allows cookie to be set
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ identifier, password, role }),
            },
          );

          console.log("Response status:", res.status);
          const data = await res.json();
          console.log("Response data:", data);

          if (!res.ok) {
            document.getElementById("message").innerHTML =
              '<div class="error">Login failed: ' +
              (data.error || data.message || "Unknown error") +
              "</div>";
            return;
          }

          document.getElementById("message").innerHTML =
            '<div class="success">Login successful! Session cookie set.</div>';
          document.getElementById("connect").style.display = "block";
        } catch (error) {
          console.error("Login error:", error);
          document.getElementById("message").innerHTML =
            '<div class="error">Login error: ' + error.message + "</div>";
        }
      }

      // async function connectGoogle() {
      //   try {
      //     // This endpoint returns a redirect (302)
      //     // We need to follow it directly
      //     window.location.href = 'http://localhost:3000/api/integrations/google/connect';
      //   } catch (error) {
      //     console.error('Connect error:', error);
      //     alert('Connection error: ' + error.message);
      //   }
      // }
      async function connectGoogle() {
        // Direct navigation - browser will automatically send cookies
        // and follow the redirect to Google
        window.location.href = 'http://localhost:3000/api/integrations/google/connect';
      }
    </script>
  </body>
</html>
