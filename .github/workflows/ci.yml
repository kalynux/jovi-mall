# jovi-mall CI
#
# The first automated check this repository has ever had. Everything it runs already
# existed; nothing here was runnable automatically, which is how `scripts/` came to hold
# a test that had not compiled in months without anybody knowing.
#
# See PRODUCTION-READINESS plan step 0.D.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ADR-019 D-1 pins the runtime in three places: `engines`, the Dockerfile and here.
  NODE_VERSION: '22'

  # ── WHY THE HEAP CEILING IS RAISED HERE ──────────────────────────────────────
  # Without this, `tsc` dies on a standard runner with 'FATAL ERROR: Ineffective
  # mark-compacts near heap limit — JavaScript heap out of memory' and the step exits
  # 134 (SIGABRT), carrying NO TypeScript diagnostic. So it reads as a broken
  # type-check rather than as a memory ceiling, and everything after it — lint, the
  # DB-free suites, the baselined suites, npm audit — is skipped.
  #
  # That is what happened on every run of this workflow from the day it was written
  # (2026-08-18) until the plan 3.D.1 drill looked at it: five runs, five failures at
  # 'Type-check src', not one suite ever executed. Verified fixed on a throwaway
  # branch before landing here.
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  check:
    name: typecheck · lint · DB-free suites · audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # ── The environment ──────────────────────────────────────────────────────
      # `.env.example` IS the deployment contract (258 documented variables), so CI
      # uses it directly rather than keeping a second list that would drift from it.
      # This also means a broken template breaks the build, which is the right way
      # round.
      #
      # Two variables are appended because they are read at MODULE IMPORT time rather
      # than at boot — `cod/services/delivery-code.service.ts` constructs a
      # WhatsAppServiceMessenger at import, so any suite whose import graph reaches it
      # throws CONFIG_MISSING_WA_ACCESS_TOKEN before a single assertion runs. They are
      # placeholders; nothing here sends a message.
      - name: Compose a CI environment from the documented contract
        run: |
          cp .env.example .env
          {
            echo "WHATSAPP_ACCESS_TOKEN=ci-placeholder-not-a-real-token"
            echo "WHATSAPP_PHONE_NUMBER_ID=ci-placeholder-phone-number-id"
          } >> .env

      - name: Type-check src
        run: npm run typecheck

      # scripts/ entered the type checker in plan step 0.C. It is a separate config
      # because the build config emits to dist/ and would otherwise ship the corpus.
      - name: Type-check scripts
        run: npm run typecheck:scripts

      - name: Lint (src + scripts)
        run: npm run lint

      # ── The suites ───────────────────────────────────────────────────────────
      # DISCOVERED from package.json rather than listed here, so a suite added next
      # month runs without its author touching this file — the same argument
      # test:system makes for scanning `*.worker.ts` instead of keeping a list of
      # workers. `verify:*` is excluded from THIS loop on purpose: those need a real
      # database, and they run in the `live-suites` job below (plan step 24.3). Keeping
      # them out keeps this job fast and keeps a database outage from reading as a
      # broken type-check.
      #
      # The one baselined suite is excluded here and asserted below by exact count.
      - name: DB-free suites
        run: |
          set -euo pipefail
          # EMPTY, and that is the point — see the note below. Every DB-free suite
          # now runs in this loop. Keep the mechanism: it costs nothing and the next
          # deliberate exclusion needs somewhere to go.
          BASELINED=""
          SUITES=$(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')")
          failed=""
          for suite in $SUITES; do
            case " $BASELINED " in *" $suite "*) echo "── $suite — baselined, asserted separately"; continue;; esac
            echo "── $suite"
            npm run --silent "$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi

      # ── There is no longer a known-red suite, and the mechanism is kept anyway ──
      # A pipeline that is red from its first run trains people to ignore it, which is
      # the exact failure this whole workflow exists to prevent. So a suite that failed
      # for a declared reason was asserted at its EXACT counts, failing IN EITHER
      # DIRECTION — a new failure still caught, a fix noticed rather than absorbed.
      #
      # ALL THREE baselines are now gone, each because the suite went green:
      #
      #   test:contact-validation  73/1  -> 74/0   plan step 4.A.2
      #   test:mobile-auth        127/2  -> 132/0  2026-08-21, Phase 5 Part E
      #   verify:messaging-login   36/1  ->  41/0  2026-08-21, same change
      #
      # The last two were the `isValid` pair: the commented `if (!isValid) throw` in
      # auth.service.ts was RESTORED with the Phase 5 admin cutover, so the two failures
      # it caused went with it and both suites then grew.
      #
      # ⚠ THE FIX SAT UNNOTICED FOR TWO DAYS, and this comment is where that gets
      # recorded. Two phase close-outs re-stated "the two baseline reds are unchanged"
      # without re-running either command; the numbers above were taken on 2026-08-23 by
      # actually running them. The fail-in-either-direction rule was built precisely to
      # catch this and could not, because nothing had been PUSHED since Phase 4 — an
      # assertion that never executes enforces nothing, however well designed.
      #
      # jovi-mall now has NO red assertion anywhere. If a suite ever needs excluding
      # again, add it to BASELINED above AND add an assert_counts line here — dropping
      # it from one place only is how a fix becomes a red build.

      # ── A REAL gate now, at high+ (plan step 2.D.5) ──────────────────────────
      # Was reporting-only at 49 vulnerabilities / 4 critical. Part 2.D took production to
      # **6, all moderate, all one advisory**, so the gate is hard — a permanently-yellow
      # step is one people stop reading, which is the failure this whole workflow exists
      # to prevent.
      #
      # `--audit-level=high` rather than the default, and the residual is named rather than
      # waved at: all six are `uuid@9.0.1` reached through
      # firebase-admin -> @google-cloud/storage -> teeny-request/retry-request
      # ("Missing buffer bounds check in v3/v5/v6 when buf is provided", fixed in 11.1.1).
      #
      # Three facts decide the threshold:
      #   1. OUR direct `uuid` is 13.0.2 and is not affected. Only the Google SDK's copy is.
      #   2. npm's suggested "fix" is firebase-admin@10.3.0 — a DOWNGRADE from 14 that would
      #      reintroduce every critical this part just cleared. It is not a fix.
      #   3. An `overrides` entry forcing uuid@11+ into a Google SDK internal would land in
      #      the Firebase Storage path, which is inactive here (STORAGE_PROVIDER=local) and
      #      therefore unverifiable. A residual that is understood beats an unverified
      #      override.
      #
      # Lower this to the default the moment @google-cloud/storage ships a bumped uuid.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════════
  #  The live suites — the job that needs a database (plan step 24.3)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Eight of the nine `verify:*` suites, against a real Mongo and a real Redis. These
  # are the only things that can prove an index actually built, that an aggregation
  # pipeline executes, that a route table resolves literals before `:id` params, and
  # that the graceful drain completes a request in flight. No DB-free suite can make
  # any of those claims, and until this job existed none of them ran anywhere except
  # on one developer's machine.
  #
  # ── A SEPARATE JOB, deliberately ──────────────────────────────────────────
  # Same reasoning as geo-tracker's integration job. A database-needing job fails for
  # environmental reasons sometimes — a service container that did not come up, a
  # replica set that has not elected — and if that turned the whole build red, the fast
  # checks (typecheck, lint, 40-odd DB-free suites) would look broken along with it and
  # people would stop reading the result. `needs: check` keeps the ordering without
  # merging the outcomes.
  #
  # ── MONGO MUST BE A REPLICA SET, and it is not optional ───────────────────
  # jovi-mall's writes run through `runInTransactionWithRetry`, and MongoDB offers no
  # transactions outside a replica set or a mongos. A standalone `mongod` fails every
  # transactional write — the COD chain, the earnings splits, every shipment
  # transition's compare-and-set — with an error that names transactions rather than
  # topology, which reads as a broken suite to whoever meets it first.
  #
  # It is started with `docker run` rather than as a `services:` container because a
  # service container cannot be given `--replSet` and then initiated: GitHub starts it
  # before any step runs, and `rs.initiate()` has to happen afterwards. Doing it in a
  # step also puts the requirement in front of the next reader instead of in a flag.
  #
  # ── ONE suite is excluded, and NONE is baselined any more ─────────────────
  #   verify:gateways      EXCLUDED. It talks to NotchPay and My-CoolPay with real
  #                        merchant credentials; there are none in CI, and putting them
  #                        here would put live payment keys in a workflow. Its two
  #                        money-moving probes are opt-in even locally.
  #   verify:geocoding-providers  RUNS, and SKIPS GREEN here. It needs GEO_GEOAPIFY_API_KEY
  #                        / GEO_LOCATIONIQ_API_KEY, which CI does not have; the suite is
  #                        built to report each absent provider as skipped and stay green,
  #                        saying loudly that it proved nothing. Locally, with both keys,
  #                        it is 28/0 (2026-08-23). Do NOT add the keys here — it spends
  #                        real quota on every run and the answer does not change per-commit.
  #   verify:messaging-login  NO LONGER BASELINED. It was 36/1 for the same reason
  #                        `test:mobile-auth` was 127/2 — the commented
  #                        `if (!isValid) throw` in `auth.service.ts`. That line was
  #                        RESTORED in Phase 5 Part E on 2026-08-21, so both suites went
  #                        green and then grew: 41/0 and 132/0, measured 2026-08-23. It
  #                        runs in the ordinary loop below like every other live suite.
  live-suites:
    name: live suites · Mongo (replica set) + Redis
    runs-on: ubuntu-latest
    needs: check

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # A single-node replica set is enough: `rs.initiate()` with one member elects
      # itself primary in a second or two and supports transactions exactly as a
      # three-node set does.
      - name: Start MongoDB as a single-node replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval '
            try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }
          '
          # Wait for the election. Without this the first transactional write races the
          # primary step-up and fails with NotWritablePrimary — intermittently, which is
          # worse than failing outright.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              echo "replica set is primary"; break
            fi
            sleep 2
          done

      - name: Compose a CI environment from the documented contract
        run: |
          cp .env.example .env
          {
            echo "WHATSAPP_ACCESS_TOKEN=ci-placeholder-not-a-real-token"
            echo "WHATSAPP_PHONE_NUMBER_ID=ci-placeholder-phone-number-id"
            echo "MONGO_URI=mongodb://127.0.0.1:27017/jovi_mall_ci?replicaSet=rs0"
            echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "JWT_SECRET=ci-only-secret-not-used-anywhere-else-32b"
            echo "INTERNAL_ADMIN_SERVICE_TOKEN=ci-internal-admin-token"
            echo "INTERNAL_SERVICE_TOKEN=ci-internal-service-token"
            echo "NODE_ENV=development"
          } >> .env

      # `verify:admin-users` is the one suite that needs the service listening rather
      # than booting it in-process. Started here, stopped in the always-run step below.
      # ── The database CI starts with is EMPTY, and some suites assume it is not ──
      # A developer machine has had `seed:plans` run against it at some point, months
      # ago, and nobody remembers doing it. CI gets a fresh mongo container every run,
      # so the first live run that ever happened failed inside verify:agent-e2e with
      #     Default vendor plan 'starter' is not configured. Run the plan seed.
      # raised from the COD earnings split — a failure three layers below the assertion
      # that tripped, and nothing to do with the code under test.
      #
      # Pricing plans are reference data, not fixtures: the owner-scoped billing engine
      # resolves every vendor, agency and agent to a plan, so a missing `starter` makes
      # any money path throw. Seeding is therefore part of standing the service up, not
      # part of any one suite.
      #
      # It runs BEFORE the server starts so a suite can never observe a half-seeded
      # database, and it is idempotent — safe to re-run against a warm database too.
      - name: Seed reference data (pricing plans, negotiation playbook)
        run: |
          set -euo pipefail
          npm run seed:plans
          # ⚠ `verify:negotiation-playbook` REFUSES OUTRIGHT without this, and that refusal is
          #   correct: the bargaining model reads its playbook from Mongo, not from the file in
          #   the repository, so an unseeded database means bargaining is off and the suite says
          #   so rather than passing on an inert feature.
          #
          #   Idempotent by checksum (LF-normalised) and it keeps superseded versions, so
          #   re-running it against a warm database is free — the same property that lets the
          #   line above sit here.
          #
          #   The suite landed on 2026-09-20 and had never run in CI before 2026-09-21: this
          #   job is gated on `check`, and `check` was red for five days.
          npm run seed:negotiation-playbook

      - name: Start jovi-mall
        run: |
          set -euo pipefail
          npm run dev > /tmp/jovi-dev.log 2>&1 &
          echo $! > /tmp/jovi.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8022/api/health >/dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "::error::jovi-mall did not become healthy"; tail -100 /tmp/jovi-dev.log; exit 1

      # ── The landing app, for verify:landing-routes ────────────────────────────
      #
      # `SURFACE_PATHS` in `domain/bot-list-window.ts` is a HAND-KEPT COPY of the landing
      # app's URL structure, and the bot puts those paths in front of real customers. When a
      # page is renamed over there, nothing in THIS repository changes and nothing fails —
      # the bot simply starts sending people to a 404. This check is the only thing that
      # catches it, and it can only do so with the other repository present.
      #
      # ⚠ It ran for the first time on 2026-09-21. It was added on 2026-09-21 and had never
      #   executed: this job declares `needs: check`, `check` had been red since 2026-09-16
      #   for an unrelated reason, and a skipped job is indistinguishable from a passing one.
      #
      # `main`, not a pinned ref, and deliberately: a dead link is dead as soon as the landing
      # app ships the rename, so pinning would hide exactly the drift this exists to find.
      - name: Check out the landing app
        uses: actions/checkout@v4
        with:
          repository: kalynux/jovi-mall-landing
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: landing-app

      - name: Live suites
        run: |
          set -uo pipefail
          # ⚠ verify:negotiation-lock needs a POPULATED CATALOGUE, which this job does not
          #   have. It searches for a variant with an effective bargain window and refuses
          #   to assert against an inert feature -- correctly, since passing on an empty
          #   database would prove nothing. Its own message names the fix,
          #   `npm run seed:bargain-windows`, but that seed MODIFIES existing variants and
          #   creates none, so it is a no-op here: this database is seeded with pricing
          #   plans and nothing else.
          #
          #   The seed that WOULD give it a catalogue is seed:cod-shipments, and chaining it
          #   was rejected: it also creates vendors, agencies, agents, orders and shipments
          #   into the ONE database every other live suite shares, and several of those
          #   count rows. Trading a known gap for an unknown one is the wrong direction.
          #
          #   ⚠ THIS IS A COVERAGE HOLE, NOT A RESOLVED ISSUE. The real fix is to make the
          #   suite build its own fixture and tear it down, the way the other live suites
          #   do. Until then the price-lock resolver is proven only against a developer
          #   database, by hand. Excluded on 2026-09-13, the first run of this job that
          #   ever reached it.
          # ⚠ verify:landing-routes is out of THIS LOOP but it is NOT skipped — it runs in its
          #   own step below, because it is the one suite here that takes an ARGUMENT and this
          #   loop passes none. It needs a second repository (the landing app), which the step
          #   below checks out. See the long note there.
          EXCLUDED="verify:gateways verify:negotiation-lock verify:landing-routes"
          # EMPTY — see the note above the job. Kept so the next deliberate
          # exclusion has somewhere to go.
          BASELINED=""
          SUITES=$(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('verify:')).join(' ')")
          failed=""
          for suite in $SUITES; do
            case " $EXCLUDED " in *" $suite "*) echo "── $suite — excluded (needs live gateway credentials)"; continue;; esac
            case " $BASELINED " in *" $suite "*) echo "── $suite — baselined, asserted separately"; continue;; esac
            echo "── $suite"
            npm run --silent "$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing live suites:$failed"
            exit 1
          fi

      # Its own step, because it is the one suite here that takes an argument. `always()` so a
      # failure in the loop above does not hide a dead customer-facing link underneath it —
      # these two answer different questions and neither should mask the other.
      - name: verify:landing-routes (against the real landing app)
        if: always()
        run: |
          set -euo pipefail
          # The suite REFUSES rather than passing when the app is absent, so a missing or
          # unreadable checkout reads as a failure here rather than as a silent green. If this
          # step fails on the checkout above with a 403 or 404, CROSS_REPO_TOKEN cannot read
          # kalynux/jovi-mall-landing and needs that repository added to its scope.
          npm run --silent verify:landing-routes -- --landing "${GITHUB_WORKSPACE}/landing-app"

      # The "Baselined live suite (exact counts)" step that stood here asserted
      # verify:messaging-login at 36/1 and was DELETED on 2026-08-23, because the suite
      # is 41/0. Removing it from BASELINED above without also deleting this step would
      # have turned the fix into a red build — that block failed in EITHER direction,
      # which is exactly what it was for, and is the same two-places edit the DB-free
      # note above describes.

      - name: Stop jovi-mall
        if: always()
        run: |
          if [ -f /tmp/jovi.pid ]; then kill "$(cat /tmp/jovi.pid)" 2>/dev/null || true; fi
          echo "── last 60 lines of the server log ──"
          tail -60 /tmp/jovi-dev.log || true
