# jovi-mall CI
#
# The first automated check this repository has ever had. Everything it runs already
# existed; nothing here was runnable automatically, which is how `scripts/` came to hold
# a test that had not compiled in months without anybody knowing.
#
# See PRODUCTION-READINESS plan step 0.D.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ADR-019 D-1 pins the runtime in three places: `engines`, the Dockerfile and here.
  NODE_VERSION: '22'

  # ── WHY THE HEAP CEILING IS RAISED HERE ──────────────────────────────────────
  # Without this, `tsc` dies on a standard runner with 'FATAL ERROR: Ineffective
  # mark-compacts near heap limit — JavaScript heap out of memory' and the step exits
  # 134 (SIGABRT), carrying NO TypeScript diagnostic. So it reads as a broken
  # type-check rather than as a memory ceiling, and everything after it — lint, the
  # DB-free suites, the baselined suites, npm audit — is skipped.
  #
  # That is what happened on every run of this workflow from the day it was written
  # (2026-08-18) until the plan 3.D.1 drill looked at it: five runs, five failures at
  # 'Type-check src', not one suite ever executed. Verified fixed on a throwaway
  # branch before landing here.
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  check:
    name: typecheck · lint · DB-free suites · audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # ── The environment ──────────────────────────────────────────────────────
      # `.env.example` IS the deployment contract (258 documented variables), so CI
      # uses it directly rather than keeping a second list that would drift from it.
      # This also means a broken template breaks the build, which is the right way
      # round.
      #
      # Two variables are appended because they are read at MODULE IMPORT time rather
      # than at boot — `cod/services/delivery-code.service.ts` constructs a
      # WhatsAppServiceMessenger at import, so any suite whose import graph reaches it
      # throws CONFIG_MISSING_WA_ACCESS_TOKEN before a single assertion runs. They are
      # placeholders; nothing here sends a message.
      - name: Compose a CI environment from the documented contract
        run: |
          cp .env.example .env
          {
            echo "WHATSAPP_ACCESS_TOKEN=ci-placeholder-not-a-real-token"
            echo "WHATSAPP_PHONE_NUMBER_ID=ci-placeholder-phone-number-id"
          } >> .env

      - name: Type-check src
        run: npm run typecheck

      # scripts/ entered the type checker in plan step 0.C. It is a separate config
      # because the build config emits to dist/ and would otherwise ship the corpus.
      - name: Type-check scripts
        run: npm run typecheck:scripts

      - name: Lint (src + scripts)
        run: npm run lint

      # ── The suites ───────────────────────────────────────────────────────────
      # DISCOVERED from package.json rather than listed here, so a suite added next
      # month runs without its author touching this file — the same argument
      # test:system makes for scanning `*.worker.ts` instead of keeping a list of
      # workers. `verify:*` is excluded from THIS loop on purpose: those need a real
      # database, and they run in the `live-suites` job below (plan step 24.3). Keeping
      # them out keeps this job fast and keeps a database outage from reading as a
      # broken type-check.
      #
      # The one baselined suite is excluded here and asserted below by exact count.
      - name: DB-free suites
        run: |
          set -euo pipefail
          BASELINED="test:mobile-auth"
          SUITES=$(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')")
          failed=""
          for suite in $SUITES; do
            case " $BASELINED " in *" $suite "*) echo "── $suite — baselined, asserted separately"; continue;; esac
            echo "── $suite"
            npm run --silent "$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi

      # ── The one known-red suite, declared rather than tolerated ──────────────
      # A pipeline that is red from its first run trains people to ignore it, which is
      # the exact failure this whole workflow exists to prevent. So the suite that fails
      # today is asserted at its EXACT counts and the build fails if either number moves
      # IN EITHER DIRECTION — a new failure is still caught, and a fix is noticed rather
      # than silently absorbed.
      #
      #   test:mobile-auth       127/2  — the FAILURE count is what is baselined: the
      #                                   commented `if (!isValid) throw` in
      #                                   auth.service.ts, excluded by owner instruction.
      #                                   If it is ever re-enabled, the 2 moves and this
      #                                   file must move with it. The PASS count moves
      #                                   whenever the suite grows — 101 → 102 in plan
      #                                   step 2.E.3, which added the assertion that
      #                                   .env.example's ALLOWED_ORIGINS VALUE, not just
      #                                   its comment, carries the Capacitor origins; and
      #                                   102 → 127 in plan step 4.A.5, the 90-day absolute
      #                                   session cap (ADR-A03) — 25 assertions covering
      #                                   the arithmetic, the byte-identical copy through a
      #                                   re-issue, D-9's iat fallback, and the source scans
      #                                   that are the only thing capable of catching a
      #                                   re-stamp in under 90 days.
      #
      # test:contact-validation was the second, at 73/1, and is GONE from both places as
      # of plan step 4.A.2 — it is 74/0 and runs in the discovery loop above like every
      # other suite. Dropping it from BASELINED without also deleting its assert_counts
      # line would have turned the fix itself into a red build: that block fails in
      # EITHER direction, which is exactly what it is for.
      #
      # A second suite is red for the same `isValid` reason: verify:messaging-login,
      # 36/1 on "…and the OLD password no longer works". It is a LIVE suite, so it is
      # baselined in the `live-suites` job below rather than here — same shape, same
      # fail-in-either-direction rule. Re-enabling that line moves BOTH baselines.
      - name: Baselined suites (exact counts)
        run: |
          set -uo pipefail
          assert_counts() {
            suite="$1"; want_pass="$2"; want_fail="$3"
            out=$(npm run --silent "$suite" 2>&1 || true)
            got=$(echo "$out" | grep -oE '[0-9]+ passed, [0-9]+ failed' | tail -1)
            want="$want_pass passed, $want_fail failed"
            if [ "$got" != "$want" ]; then
              echo "$out"
              echo "::error::$suite — baseline is '$want', got '${got:-no count line}'."
              echo "::error::If this is a FIX, update the baseline in .github/workflows/ci.yml."
              return 1
            fi
            echo "✔ $suite — $got (baseline held)"
          }
          rc=0
          assert_counts test:mobile-auth 127 2 || rc=1
          exit $rc

      # ── A REAL gate now, at high+ (plan step 2.D.5) ──────────────────────────
      # Was reporting-only at 49 vulnerabilities / 4 critical. Part 2.D took production to
      # **6, all moderate, all one advisory**, so the gate is hard — a permanently-yellow
      # step is one people stop reading, which is the failure this whole workflow exists
      # to prevent.
      #
      # `--audit-level=high` rather than the default, and the residual is named rather than
      # waved at: all six are `uuid@9.0.1` reached through
      # firebase-admin -> @google-cloud/storage -> teeny-request/retry-request
      # ("Missing buffer bounds check in v3/v5/v6 when buf is provided", fixed in 11.1.1).
      #
      # Three facts decide the threshold:
      #   1. OUR direct `uuid` is 13.0.2 and is not affected. Only the Google SDK's copy is.
      #   2. npm's suggested "fix" is firebase-admin@10.3.0 — a DOWNGRADE from 14 that would
      #      reintroduce every critical this part just cleared. It is not a fix.
      #   3. An `overrides` entry forcing uuid@11+ into a Google SDK internal would land in
      #      the Firebase Storage path, which is inactive here (STORAGE_PROVIDER=local) and
      #      therefore unverifiable. A residual that is understood beats an unverified
      #      override.
      #
      # Lower this to the default the moment @google-cloud/storage ships a bumped uuid.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════════
  #  The live suites — the job that needs a database (plan step 24.3)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Eight of the nine `verify:*` suites, against a real Mongo and a real Redis. These
  # are the only things that can prove an index actually built, that an aggregation
  # pipeline executes, that a route table resolves literals before `:id` params, and
  # that the graceful drain completes a request in flight. No DB-free suite can make
  # any of those claims, and until this job existed none of them ran anywhere except
  # on one developer's machine.
  #
  # ── A SEPARATE JOB, deliberately ──────────────────────────────────────────
  # Same reasoning as geo-tracker's integration job. A database-needing job fails for
  # environmental reasons sometimes — a service container that did not come up, a
  # replica set that has not elected — and if that turned the whole build red, the fast
  # checks (typecheck, lint, 40-odd DB-free suites) would look broken along with it and
  # people would stop reading the result. `needs: check` keeps the ordering without
  # merging the outcomes.
  #
  # ── MONGO MUST BE A REPLICA SET, and it is not optional ───────────────────
  # jovi-mall's writes run through `runInTransactionWithRetry`, and MongoDB offers no
  # transactions outside a replica set or a mongos. A standalone `mongod` fails every
  # transactional write — the COD chain, the earnings splits, every shipment
  # transition's compare-and-set — with an error that names transactions rather than
  # topology, which reads as a broken suite to whoever meets it first.
  #
  # It is started with `docker run` rather than as a `services:` container because a
  # service container cannot be given `--replSet` and then initiated: GitHub starts it
  # before any step runs, and `rs.initiate()` has to happen afterwards. Doing it in a
  # step also puts the requirement in front of the next reader instead of in a flag.
  #
  # ── ONE suite is excluded, and one is baselined ───────────────────────────
  #   verify:gateways      EXCLUDED. It talks to NotchPay and My-CoolPay with real
  #                        merchant credentials; there are none in CI, and putting them
  #                        here would put live payment keys in a workflow. Its two
  #                        money-moving probes are opt-in even locally.
  #   verify:messaging-login  BASELINED at 36/1, for the same reason `test:mobile-auth`
  #                        is baselined at 127/2: the commented `if (!isValid) throw`
  #                        in `auth.service.ts`, out of scope by owner instruction. Its
  #                        one failure is "…and the OLD password no longer works". If
  #                        that line is ever re-enabled, both baselines move together.
  live-suites:
    name: live suites · Mongo (replica set) + Redis
    runs-on: ubuntu-latest
    needs: check

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # A single-node replica set is enough: `rs.initiate()` with one member elects
      # itself primary in a second or two and supports transactions exactly as a
      # three-node set does.
      - name: Start MongoDB as a single-node replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval '
            try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) }
          '
          # Wait for the election. Without this the first transactional write races the
          # primary step-up and fails with NotWritablePrimary — intermittently, which is
          # worse than failing outright.
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              echo "replica set is primary"; break
            fi
            sleep 2
          done

      - name: Compose a CI environment from the documented contract
        run: |
          cp .env.example .env
          {
            echo "WHATSAPP_ACCESS_TOKEN=ci-placeholder-not-a-real-token"
            echo "WHATSAPP_PHONE_NUMBER_ID=ci-placeholder-phone-number-id"
            echo "MONGO_URI=mongodb://127.0.0.1:27017/jovi_mall_ci?replicaSet=rs0"
            echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "JWT_SECRET=ci-only-secret-not-used-anywhere-else-32b"
            echo "INTERNAL_ADMIN_SERVICE_TOKEN=ci-internal-admin-token"
            echo "INTERNAL_SERVICE_TOKEN=ci-internal-service-token"
            echo "NODE_ENV=development"
          } >> .env

      # `verify:admin-users` is the one suite that needs the service listening rather
      # than booting it in-process. Started here, stopped in the always-run step below.
      - name: Start jovi-mall
        run: |
          set -euo pipefail
          npm run dev > /tmp/jovi-dev.log 2>&1 &
          echo $! > /tmp/jovi.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8022/api/health >/dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "::error::jovi-mall did not become healthy"; tail -100 /tmp/jovi-dev.log; exit 1

      - name: Live suites
        run: |
          set -uo pipefail
          EXCLUDED="verify:gateways"
          BASELINED="verify:messaging-login"
          SUITES=$(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('verify:')).join(' ')")
          failed=""
          for suite in $SUITES; do
            case " $EXCLUDED " in *" $suite "*) echo "── $suite — excluded (needs live gateway credentials)"; continue;; esac
            case " $BASELINED " in *" $suite "*) echo "── $suite — baselined, asserted separately"; continue;; esac
            echo "── $suite"
            npm run --silent "$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing live suites:$failed"
            exit 1
          fi

      # Same shape as the DB-free baseline block: exact counts, failing in EITHER
      # direction, so a fix is noticed rather than silently absorbed.
      - name: Baselined live suite (exact counts)
        run: |
          set -uo pipefail
          out=$(npm run --silent verify:messaging-login 2>&1 || true)
          got=$(echo "$out" | grep -oE '[0-9]+ passed, [0-9]+ failed' | tail -1)
          want="36 passed, 1 failed"
          if [ "$got" != "$want" ]; then
            echo "$out"
            echo "::error::verify:messaging-login — baseline is '$want', got '${got:-no count line}'."
            echo "::error::If this is a FIX, update the baseline in .github/workflows/ci.yml."
            exit 1
          fi
          echo "✔ verify:messaging-login — $got (baseline held)"

      - name: Stop jovi-mall
        if: always()
        run: |
          if [ -f /tmp/jovi.pid ]; then kill "$(cat /tmp/jovi.pid)" 2>/dev/null || true; fi
          echo "── last 60 lines of the server log ──"
          tail -60 /tmp/jovi-dev.log || true
